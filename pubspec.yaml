name: madar
description: "MADAR | Modern Islamic App"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.34
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  equatable: ^2.0.7
  geolocator: ^14.0.3
  permission_handler: ^13.0.2
  sensors_plus: ^7.1.0
  flutter_local_notifications: ^22.3.1
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.28.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/data/
    - assets/fonts/
