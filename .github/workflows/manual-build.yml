name: MADAR Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target'
        required: true
        default: 'android'
        type: choice
        options: [android, ios]
      build_type:
        description: 'Android: apk/appbundle. iOS: ios'
        required: true
        default: 'apk'
        type: choice
        options: [apk, appbundle, ios]

jobs:
  android:
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding when absent
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.madar .; fi
      - name: Configure background audio manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.WAKE_LOCK' not in s:
              s=s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              s=s.replace('>\n', '>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n', 1)
          s=s.replace('android:name=".MainActivity"', 'android:name="com.ryanheise.audioservice.AudioServiceActivity"')
          service='''        <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable"><intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter></service>
          <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable"><intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter></receiver>
'''
          if 'com.ryanheise.audioservice.AudioService' not in s:
              s=s.replace('</application>', service+'    </application>')
          p.write_text(s)
          PY
      - name: Configure Android notification desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s=s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s=s.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")')
          p.write_text(s)
          PY
      - run: flutter pub get
      - name: Prepare verified Quran content
        run: dart run tool/prepare_content.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ inputs.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: madar-${{ inputs.build_type }}
          path: build/app/outputs/**/*

  ios:
    if: ${{ inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffolding when absent
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.madar .; fi
      - name: Configure iOS background audio
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true
      - name: Configure iOS permission descriptions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string MADAR uses your location only for prayer times and Qibla when you choose." ios/Runner/Info.plist || true
      - name: Configure permission_handler iOS macros
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ios/Podfile")
          s=p.read_text()
          marker="flutter_additional_ios_build_settings(target)"
          if "PERMISSION_LOCATION_WHENINUSE=1" not in s:
              s=s.replace(marker, marker+"\n      target.build_configurations.each do |config|\n        config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= ['$(inherited)', 'PERMISSION_LOCATION_WHENINUSE=1', 'PERMISSION_NOTIFICATIONS=1']\n      end")
              p.write_text(s)
          PY
      - run: flutter pub get
      - name: Prepare verified Quran content
        run: dart run tool/prepare_content.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: madar-ios
          path: build/ios/iphoneos/Runner.app
