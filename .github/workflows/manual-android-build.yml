name: MADAR Manual Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android --org com.madar --project-name madar

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Rasterize MADAR icon
        run: magick assets/branding/madar_icon.svg -background none assets/branding/madar_icon.png

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare verified Islamic content
        run: dart run tool/prepare_content.dart

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
